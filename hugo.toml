baseURL = 'https://victorkomarov.com/'
locale = 'en-GB'
title = 'Victor Komarov'
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term']

[params]
  description = 'Writing about machine learning systems, performance, software engineering, and management.'

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]
    [markup.goldmark.renderer]
      unsafe = false
  [markup.highlight]
    lineNos = false
    noClasses = true
    style = 'github'

[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML', 'RSS']

[permalinks]
  [permalinks.page]
    posts = '/:slug/'
